# Weekly, with minor and patch bumps grouped into one pull request per ecosystem so the week's
# routine updates are one CI run and one review. A major bump still gets a pull request of its
# own, because that is the one that needs reading.
#
# A bump of the rust image tag in the Dockerfile fails CI until rust-toolchain.toml names the
# same version: push the toolchain bump onto that pull request.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # svelte-check (4.7.6, the newest) declares a peer of typescript ^5 || ^6, so a TypeScript
      # major cannot land until svelte-check accepts it. Drop this once a svelte-check release
      # does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
