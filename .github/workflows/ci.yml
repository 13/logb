name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: backend (clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # rust-embed needs frontend/dist/ at compile time, and tests/export.rs expects the app
      # icon in it. Cheaper than a node toolchain, and exercises the real code path.
      - run: mkdir -p frontend/dist && cp frontend/public/icon.svg frontend/dist/
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  backend-postgres:
    name: backend on postgresql
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: logb
        ports: ['5432:5432']
        # pg_isready, not a fixed sleep: a container that answers "accepting connections" late
        # (which happens) would otherwise start the suite against a server that isn't up yet.
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-embed needs frontend/dist to exist to compile; the tracked .gitkeep keeps the
      # directory, and the icon is what the export test looks for.
      - run: mkdir -p frontend/dist && cp frontend/public/icon.svg frontend/dist/
      # `concurrent_setup_creates_exactly_one_admin` (tests/auth.rs) is a known, owned failure
      # on PostgreSQL: `INSERT ... WHERE NOT EXISTS` is atomic only under SQLite's single
      # writer, so two concurrent first-run setups both succeed here. It is excluded by name,
      # not skipped in the test itself, so a reader running the suite locally against
      # PostgreSQL still sees it fail. Part two of the port owns fixing the race; remove this
      # exclusion when that lands.
      - run: cargo test --all-targets --locked -- --skip concurrent_setup_creates_exactly_one_admin
        env:
          LOGB_TEST_DATABASE_URL: postgres://postgres:logb@127.0.0.1:5432/postgres

  frontend:
    name: frontend (types + unit tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: cargo build --locked
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # test-results/, not playwright-report/: the reporter is `list`, which writes no HTML
          # report, so this step has been silently uploading nothing. Traces and screenshots
          # land in test-results/.
          path: frontend/test-results
          retention-days: 7

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    # The action reports findings by creating a check run, which the default read-only
    # GITHUB_TOKEN cannot do -- it fails with "Resource not accessible by integration" even
    # when the audit itself found nothing, so the job's result says nothing about the audit.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: logb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Smoke test: the image must boot and answer /api/health.
      - name: Boot the image
        run: |
          docker run -d --name logb-ci -p 8080:8080 -v logb-ci-data:/data logb:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then echo; exit 0; fi
            sleep 1
          done
          echo "health check never succeeded"; docker logs logb-ci; exit 1
