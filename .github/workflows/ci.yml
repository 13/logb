name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published without anyone pushing a commit, so the dependency audit also runs
  # weekly on its own. Every other job skips a scheduled run: nothing they check has changed.
  schedule:
    - cron: '23 5 * * 1'
  # release.yml runs this whole workflow against the tagged commit and publishes only if it passes.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned by commit SHA, with the release in a comment: a tag can be
# moved to different code after review, a SHA cannot. Dependabot bumps both together.
#
# The Rust toolchain comes from rust-toolchain.toml: `rustup toolchain install` with no argument
# installs the version and components that file names, so CI, local builds and the Dockerfile's
# rust image all agree on one compiler.

jobs:
  backend:
    name: backend (clippy + tests)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rust-embed needs frontend/dist/ at compile time, and tests/export.rs expects the app
      # icon in it. Cheaper than a node toolchain, and exercises the real code path.
      - run: mkdir -p frontend/dist && cp frontend/public/icon.svg frontend/dist/
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  backend-postgres:
    name: backend on postgresql
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: logb
        ports: ['5432:5432']
        # pg_isready, not a fixed sleep: a container that answers "accepting connections" late
        # (which happens) would otherwise start the suite against a server that isn't up yet.
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rust-embed needs frontend/dist to exist to compile; the tracked .gitkeep keeps the
      # directory, and the icon is what the export test looks for.
      - run: mkdir -p frontend/dist && cp frontend/public/icon.svg frontend/dist/
      - run: cargo test --all-targets --locked
        env:
          LOGB_TEST_DATABASE_URL: postgres://postgres:logb@127.0.0.1:5432/postgres

  frontend:
    name: frontend (types + unit tests + build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    name: end-to-end
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: cargo build --locked
      # Browsers are tied to the exact @playwright/test release, so that is the cache key: a
      # Dependabot bump of the package downloads the matching browsers once, then hits again.
      - name: Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Still run on a cache hit: the browser download is then skipped, but --with-deps installs
      # the system libraries, which live outside the cached directory.
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          # test-results/, not playwright-report/: the reporter is `list`, which writes no HTML
          # report, so this step has been silently uploading nothing. Traces and screenshots
          # land in test-results/.
          path: frontend/test-results
          retention-days: 7

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    # The action reports findings by creating a check run, which the default read-only
    # GITHUB_TOKEN cannot do -- it fails with "Resource not accessible by integration" even
    # when the audit itself found nothing, so the job's result says nothing about the audit.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup toolchain install
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # Here rather than in the frontend job so the weekly run covers npm advisories too. It
      # reads only package-lock.json, so no install is needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: npm audit --audit-level=high
        working-directory: frontend

  docker:
    name: container image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The image compiles the release with its own rust, not rust-toolchain.toml's; a bump of
      # one without the other (a Dependabot image bump, say) would ship a binary built by a
      # compiler CI never ran clippy or the tests under.
      - name: The rust image matches rust-toolchain.toml
        run: |
          toolchain=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          image=$(grep -m1 -o 'rust:[0-9][^-@ ]*' Dockerfile | cut -d: -f2)
          if [ "$toolchain" != "$image" ]; then
            echo "rust-toolchain.toml says $toolchain, the Dockerfile's rust image is $image" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Both architectures the release publishes. The backend cross-compiles, so arm64 needs no
      # emulation here -- this is what tells a pull request that the arm64 build still links,
      # rather than finding out from a tag.
      - name: Build (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: LOGB_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The same build again, every layer a cache hit, loaded so it can be booted.
      - name: Load the amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: logb:ci
          build-args: LOGB_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
      # Smoke test: the image must boot and answer /api/health.
      - name: Boot the image
        run: |
          docker run -d --name logb-ci -p 8080:8080 -v logb-ci-data:/data logb:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then echo; exit 0; fi
            sleep 1
          done
          echo "health check never succeeded"; docker logs logb-ci; exit 1
