[package]
name = "logb"
version = "0.12.0"
edition = "2021"
description = "Complete history of your owned objects"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["compression-gzip", "cors", "set-header", "trace"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "postgres", "any", "migrate"] }
argon2 = "0.6"
rand = "0.10"
rust-embed = "8"
image = "0.25"
kamadak-exif = "0.6"
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
mime_guess = "2"
time = "0.3"
reqwest = { version = "0.13", features = ["json"] }
chrono-tz = "0.10.4"
tokio-util = { version = "0.7.19", features = ["io"] }
web-push-native = { version = "0.5", default-features = false }
p256 = { version = "0.13", features = ["ecdsa"] }
base64ct = { version = "1.8", features = ["alloc"] }
unicode-normalization = "0.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
percent-encoding = "2.3.2"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "multipart", "cookies"] }
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
