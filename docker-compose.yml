services:
  logb:
    build: .
    image: logb:latest
    container_name: logb
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # A named volume, so a fresh `docker compose up` works with no setup: it starts out owned
      # by the image's uid 65532. To keep the data in a host directory instead, see "Run with
      # Docker" in the README -- the directory has to be chowned to 65532 first.
      - logb-data:/data
    environment:
      LOGB_MAX_UPLOAD_MB: "50"
      LOGB_SECURE_COOKIE: "auto"
      LOGB_LOG: "info"
      LOGB_TRUST_PROXY: "false"
      # Unset means the SQLite file in /data. Nothing here is interpolated from the shell, so
      # moving to PostgreSQL means uncommenting this line and `docker compose up -d logb` --
      # see "Moving to PostgreSQL" in the README. Files and thumbnails stay in /data either way.
      # LOGB_DATABASE_URL: "postgres://user:pass@host/logb"
      # Nightly snapshot of the SQLite database, kept beside it in the same volume. The binary
      # takes none unless this is set; this file sets it. Blobs under files/ are
      # content-addressed and never rewritten, so a plain copy of that directory pairs with any
      # snapshot. Copy both off the host too: a snapshot on the same disk guards against
      # mistakes, not against losing the disk.
      LOGB_BACKUP_DIR: "/data/backups"

volumes:
  logb-data:
