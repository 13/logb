services:
  logb:
    build: .
    image: logb:latest
    container_name: logb
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      LOGB_MAX_UPLOAD_MB: "50"
      LOGB_SECURE_COOKIE: "auto"
      LOGB_LOG: "info"
      LOGB_TRUST_PROXY: "false"
