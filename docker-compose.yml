services:
  logb:
    build: .
    image: logb:latest
    container_name: logb
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      LOGB_MAX_UPLOAD_MB: "50"
      LOGB_SECURE_COOKIE: "auto"
      LOGB_LOG: "info"
      LOGB_TRUST_PROXY: "false"
      # Nightly snapshot of the database, kept beside it. Unset means no automatic backup at
      # all, which is how this instance ran until now. Blobs under files/ are content-addressed
      # and never rewritten, so a plain copy of that directory pairs with any snapshot.
      LOGB_BACKUP_DIR: "/data/backups"
