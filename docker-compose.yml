services:
  logby:
    build: .
    image: logby:latest
    container_name: logby
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      LOGBY_MAX_UPLOAD_MB: "50"
      LOGBY_SECURE_COOKIE: "auto"
      LOGBY_LOG: "info"
      LOGBY_TRUST_PROXY: "false"
